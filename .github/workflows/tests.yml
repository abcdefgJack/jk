name: tests

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the jk test suite (Windows PowerShell 5.1, UTC)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run.ps1
      # dates and times must not depend on the machine's zone: run again far from UTC
      - name: Run it again in Pacific time
        shell: powershell
        run: |
          tzutil /s "Pacific Standard Time"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run.ps1
